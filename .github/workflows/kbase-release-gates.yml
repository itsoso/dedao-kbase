name: KBase Release Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kbase-release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOFLAGS: -tags=webkit2_41

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve trusted Go binary
        id: trusted-go
        shell: bash
        run: |
          set -Eeuo pipefail
          go_bin="$(realpath "$(command -v go)")"
          tool_cache="$(realpath "$RUNNER_TOOL_CACHE")"
          case "$go_bin" in
            "$tool_cache"/*/bin/go) ;;
            *)
              printf 'Go binary is outside RUNNER_TOOL_CACHE: %s\n' "$go_bin" >&2
              exit 1
              ;;
          esac
          test -x "$go_bin"
          printf 'bin=%s\n' "$go_bin" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            nginx

      - name: Assert normal-user execution
        run: test "$(id -u)" -ne 0

      - name: Generate ephemeral source signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          openssl_bin="$(command -v openssl)"
          test -x "$openssl_bin"
          key_dir="$RUNNER_TEMP/kbase-release-signing"
          install -d -m 0700 "$key_dir"
          "$openssl_bin" genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$key_dir/source-private.pem"
          "$openssl_bin" pkey \
            -in "$key_dir/source-private.pem" \
            -pubout \
            -out "$key_dir/source-public.pem"
          chmod 0600 "$key_dir/source-private.pem"
          chmod 0644 "$key_dir/source-public.pem"

      - name: Assemble immutable source release
        run: |
          mkdir -p "$RUNNER_TEMP/kbase-release-e2e"
          bash deploy/kbase/assemble-release.sh create \
            --repo "$GITHUB_WORKSPACE" \
            --revision "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/kbase-release-e2e/source"
          bash deploy/kbase/release-signature.sh sign \
            --manifest "$RUNNER_TEMP/kbase-release-e2e/source/release-manifest.json" \
            --signature "$RUNNER_TEMP/kbase-release-e2e/source/MANIFEST.sig" \
            --signing-key "$RUNNER_TEMP/kbase-release-signing/source-private.pem" \
            --openssl-bin "$(command -v openssl)"
          rm -f "$RUNNER_TEMP/kbase-release-signing/source-private.pem"

      - name: Verify Go modules
        run: go mod verify

      - name: Build and smoke-test desktop frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          shopt -s nullglob
          smokes=(scripts/*-smoke.mjs)
          test "${#smokes[@]}" -gt 0
          for smoke in "${smokes[@]}"; do
            node "$smoke"
          done

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages as normal user
        run: go test ./...

      - name: Test root-only permission ceiling
        run: |
          sudo env \
            "GOCACHE=$RUNNER_TEMP/go-build-root" \
            "GOFLAGS=$GOFLAGS" \
            "${{ steps.trusted-go.outputs.bin }}" test ./backend/app \
              -run '^TestBrowserSessionStoreDirectoryPermissionCeiling$' \
              -count=1

      - name: Smoke-test production Web frontend
        run: |
          node --check frontend-web/app.js
          shopt -s nullglob
          smokes=(frontend-web/scripts/*smoke*.mjs)
          test "${#smokes[@]}" -gt 0
          for smoke in "${smokes[@]}"; do
            node "$smoke"
          done

      - name: Build CGO server and test real Nginx proxy
        run: |
          CGO_ENABLED=1 go build \
            -trimpath \
            -o "$RUNNER_TEMP/kbase-server" \
            ./cmd/kbase-server
          KBASE_SERVER_BIN="$RUNNER_TEMP/kbase-server" \
            NGINX_BIN="$(command -v nginx)" \
            bash deploy/nginx/browser-session-proxy-smoke.sh

      - name: Smoke-test release assembly
        run: |
          node --check deploy/kbase/archive-list.mjs
          node --check deploy/kbase/stage-files.mjs
          node --check deploy/kbase/fsync-paths.mjs
          bash deploy/kbase/archive-list-smoke.sh
          bash deploy/kbase/stage-files-smoke.sh
          bash deploy/kbase/release-manifest-smoke.sh

      - name: Smoke-test transactional installer
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash deploy/kbase/install-release-smoke.sh

      - name: Reject privileged install from checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          install_args=(
            install
            --manifest /nonexistent/prepared-manifest.json
            --trusted-public-key /nonexistent/public.pem
            --binary-target /nonexistent/kbase-server
            --web-target /nonexistent/web
            --env-source /nonexistent/candidate.env
            --env-target /nonexistent/service.env
            --nginx-config-target /nonexistent/kbase.locations.conf
            --basic-auth-file /nonexistent/browser.htpasswd
            --backend-addr 127.0.0.1:8719
            --service-name dedao-kbase.service
            --nginx-service-name nginx.service
            --health-url http://127.0.0.1:8719/health
            --public-health-url https://example.invalid/health
            --backup-dir /nonexistent/backups/release
            --transaction-state-file /nonexistent/install.json
          )
          error_file="$RUNNER_TEMP/root-install-boundary.error"
          set +e
          sudo env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/root \
            bash "$GITHUB_WORKSPACE/deploy/kbase/install-release.sh" install \
            "${install_args[@]:1}" \
            >"$error_file" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q \
            'root installation requires release tools at /opt/dedao-kbase/release-tools' \
            "$error_file"

          tool_dir=/opt/dedao-kbase/release-tools
          sudo install -d -o root -g root -m 0755 "$tool_dir"
          sudo install -o root -g root -m 0755 \
            deploy/kbase/install-release.sh \
            deploy/kbase/prepare-release.sh \
            deploy/kbase/release-signature.sh \
            "$tool_dir/"
          sudo install -o root -g root -m 0644 \
            deploy/kbase/archive-list.mjs \
            deploy/kbase/stage-files.mjs \
            deploy/kbase/fsync-paths.mjs \
            "$tool_dir/"
          evil_node="$RUNNER_TEMP/evil-node"
          evil_marker="$RUNNER_TEMP/evil-node.executed"
          cat >"$evil_node" <<EOF
          #!/usr/bin/env bash
          : >"$evil_marker"
          exit 99
          EOF
          chmod 0755 "$evil_node"
          set +e
          sudo env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/root \
            bash "$tool_dir/install-release.sh" \
            "${install_args[@]}" \
            --node-bin "$evil_node" \
            >"$error_file" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q \
            'root installation does not accept executable overrides' \
            "$error_file"
          test ! -e "$evil_marker"

      - name: Verify privacy and generated system map
        run: |
          bash scripts/privacy-smoke.sh
          bash scripts/system-map-smoke.sh

      - name: Prepare unsigned Linux release
        run: |
          bash deploy/kbase/prepare-release.sh create \
            --source-manifest "$RUNNER_TEMP/kbase-release-e2e/source/release-manifest.json" \
            --output-dir "$RUNNER_TEMP/kbase-release-e2e/prepared" \
            --source-public-key "$RUNNER_TEMP/kbase-release-signing/source-public.pem" \
            --node-bin "$(command -v node)" \
            --go-bin "$(command -v go)" \
            --npm-bin "$(command -v npm)" \
            --tar-bin "$(command -v tar)" \
            --gzip-bin "$(command -v gzip)" \
            --nginx-bin "$(command -v nginx)" \
            --uname-bin "$(command -v uname)" \
            --openssl-bin "$(command -v openssl)"

      - name: Sign and verify prepared release
        shell: bash
        run: |
          set -Eeuo pipefail
          openssl_bin="$(command -v openssl)"
          key_dir="$RUNNER_TEMP/kbase-release-signing"
          # This disposable CI key validates mechanics only. Production signing
          # happens offline or in KMS after the untrusted build has completed.
          "$openssl_bin" genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$key_dir/prepared-private.pem"
          "$openssl_bin" pkey \
            -in "$key_dir/prepared-private.pem" \
            -pubout \
            -out "$key_dir/prepared-public.pem"
          chmod 0600 "$key_dir/prepared-private.pem"
          chmod 0644 "$key_dir/prepared-public.pem"
          bash deploy/kbase/release-signature.sh sign \
            --manifest "$RUNNER_TEMP/kbase-release-e2e/prepared/prepared-manifest.json" \
            --signature "$RUNNER_TEMP/kbase-release-e2e/prepared/MANIFEST.sig" \
            --signing-key "$key_dir/prepared-private.pem" \
            --openssl-bin "$openssl_bin"
          bash deploy/kbase/prepare-release.sh verify \
            --manifest "$RUNNER_TEMP/kbase-release-e2e/prepared/prepared-manifest.json" \
            --trusted-public-key "$key_dir/prepared-public.pem" \
            --node-bin "$(command -v node)" \
            --tar-bin "$(command -v tar)" \
            --gzip-bin "$(command -v gzip)" \
            --openssl-bin "$openssl_bin"
