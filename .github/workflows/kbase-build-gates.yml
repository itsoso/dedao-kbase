name: KBase Build Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kbase-build-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gates:
    name: Verify KBase build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -tags=webkit2_41

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            nginx

      - name: Assert normal-user execution
        run: test "$(id -u)" -ne 0

      - name: Verify Go modules
        run: go mod verify

      - name: Build and smoke-test desktop frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          shopt -s nullglob
          smokes=(scripts/*-smoke.mjs)
          test "${#smokes[@]}" -gt 0
          for smoke in "${smokes[@]}"; do
            node "$smoke"
          done

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

      - name: Test root-only permission ceiling
        run: |
          sudo env \
            "GOCACHE=$RUNNER_TEMP/go-build-root" \
            "GOFLAGS=$GOFLAGS" \
            "$(command -v go)" test ./backend/app \
              -run '^TestBrowserSessionStoreDirectoryPermissionCeiling$' \
              -count=1

      - name: Smoke-test production Web frontend
        run: |
          node --check frontend-web/app.js
          shopt -s nullglob
          smokes=(frontend-web/scripts/*smoke*.mjs)
          test "${#smokes[@]}" -gt 0
          for smoke in "${smokes[@]}"; do
            node "$smoke"
          done

      - name: Build both services from one revision
        run: |
          BUILD_REVISION="$(git rev-parse HEAD)"
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags "-X main.buildRevision=$BUILD_REVISION" \
            -o "$RUNNER_TEMP/kbase-server" \
            ./cmd/kbase-server
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags "-X main.bookJobWorkerVersion=ci -X main.bookJobWorkerRevision=$BUILD_REVISION" \
            -o "$RUNNER_TEMP/book-job-worker" \
            ./cmd/book-job-worker
          sha256sum "$RUNNER_TEMP/kbase-server"
          sha256sum "$RUNNER_TEMP/book-job-worker"
          export PATH="$RUNNER_TEMP:$PATH"
          book-job-worker build-info |
            grep -Fq "\"revision\":\"$BUILD_REVISION\""
          KBASE_BOOK_KNOWLEDGE_ROOT="$RUNNER_TEMP/book-knowledge" \
            KBASE_BOOK_JOB_WORKER_ID=ci-book-worker \
            KBASE_REMOTE_URL=https://kbase.example.invalid \
            KBASE_SOURCE_AGENT_TOKEN=ci-shared-source-agent-credential \
            KBASE_SOURCE_AGENT_ID=ci-book-worker-agent \
            book-job-worker check-config
          go test ./cmd/book-job-worker ./cmd/kbase-server

      - name: Verify book Worker service contract
        run: |
          if ! id -u dedao-kbase >/dev/null 2>&1; then
            sudo useradd --system --no-create-home dedao-kbase
          fi
          sudo install -d /opt/dedao-kbase/bin /etc/dedao-kbase
          sudo install -m 0755 "$RUNNER_TEMP/book-job-worker" \
            /opt/dedao-kbase/bin/book-job-worker
          sudo install -m 0600 /dev/null /etc/dedao-kbase/kbase.env
          printf '%s\n' \
            '[Unit]' \
            'Description=KBase CI dependency' \
            '[Service]' \
            'Type=oneshot' \
            'ExecStart=/bin/true' \
            'RemainAfterExit=yes' |
            sudo tee /etc/systemd/system/dedao-kbase.service >/dev/null
          systemd-analyze verify deploy/systemd/dedao-book-job-worker.service

      - name: Test real Nginx proxy
        run: |
          KBASE_SERVER_BIN="$RUNNER_TEMP/kbase-server" \
            NGINX_BIN="$(command -v nginx)" \
            bash deploy/nginx/browser-session-proxy-smoke.sh

      - name: Verify direct-deployment contract
        run: |
          bash scripts/kbase-direct-deployment-smoke.sh
          bash scripts/kbase-direct-deployment-behavior-smoke.sh

      - name: Verify source Agent control plane
        run: bash scripts/source-agent-control-plane-smoke.sh

      - name: Verify privacy and generated system map
        run: |
          bash scripts/privacy-smoke.sh
          bash scripts/system-map-smoke.sh
