# KBase browser entrypoint. Static assets contain no private knowledge data.
# Basic Auth creates a revocable HttpOnly Cookie session only when needed.
server {
    listen 80;
    server_name kbase.executor.life;

    location /.well-known/acme-challenge/ {
        root /var/www/executor.life;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kbase.executor.life;

    ssl_certificate /etc/letsencrypt/live/kbase.executor.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kbase.executor.life/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    include /etc/dedao-kbase/kbase.locations.conf;
}
